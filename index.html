<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — TradeBase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="sidebarMount"></div>

  <div class="main">
    <header class="topbar">
      <span class="page-title">Dashboard</span>
      <div class="topbar-right">
        <a href="jobs.html" class="btn btn-primary btn-sm" id="newJobBtn">+ New Job</a>
      </div>
    </header>
    <main class="content">

      <!-- Morning briefing header -->
      <div class="dash-greeting">
        <div>
          <div class="dash-greeting-name" id="greetingName">Good morning</div>
          <div class="dash-greeting-date" id="greetingDate"></div>
        </div>
        <div class="dash-summary" id="dashSummary"></div>
      </div>

      <!-- Stats: 4 blocks -->
      <div class="stats-row stats-row-4">
        <div class="stat-block">
          <div class="stat-label">Today's Jobs</div>
          <div class="stat-value" id="statToday">0</div>
          <div class="stat-sub" id="statTodaySub"></div>
        </div>
        <div class="stat-block stat-accent">
          <div class="stat-label">Outstanding</div>
          <div class="stat-value" id="statUnpaid">£0</div>
          <div class="stat-sub" id="statUnpaidSub"></div>
        </div>
        <div class="stat-block">
          <div class="stat-label">This Month</div>
          <div class="stat-value" id="statMonth">£0</div>
          <div class="stat-sub" id="statMonthLabel"></div>
        </div>
        <div class="stat-block">
          <div class="stat-label">In Progress</div>
          <div class="stat-value" id="statProgress">0</div>
          <div class="stat-sub">Active jobs</div>
        </div>
      </div>

      <!-- Main grid -->
      <div class="dash-grid">

        <!-- Today's jobs — cards -->
        <div class="tbl-wrap">
          <div class="tbl-top">
            <span class="tbl-title">Today's Jobs</span>
            <a href="jobs.html" class="btn btn-ghost btn-sm">All jobs</a>
          </div>
          <div id="todayJobsList" style="padding:8px 14px 14px"></div>
          <div id="todayEmpty" class="empty" style="display:none">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <p class="empty-title">Nothing booked today</p>
            <p class="empty-desc">No jobs scheduled for today.</p>
            <a href="jobs.html" class="btn btn-primary">Go to Jobs</a>
          </div>
        </div>

        <!-- Right column -->
        <div style="display:flex;flex-direction:column;gap:12px">

          <!-- Overdue banner (shown only when overdue invoices exist) -->
          <div id="overdueAlert" style="display:none"></div>

          <!-- This week timeline -->
          <div class="tbl-wrap">
            <div class="tbl-top">
              <span class="tbl-title">This Week</span>
              <a href="calendar.html" class="btn btn-ghost btn-sm">Calendar</a>
            </div>
            <div id="upcomingTimeline" style="padding:6px 18px 14px"></div>
            <div id="upcomingEmpty" style="display:none;padding:24px 18px;text-align:center">
              <p style="font-size:13px;color:var(--text-3)">Nothing coming up this week.</p>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="app.js"></script>
<script>
document.getElementById('sidebarMount').outerHTML = sidebarHtml('index.html');

function quickStatus(jobId, status, event) {
  event.stopPropagation();
  const j = DB.getJob(jobId);
  if (!j) return;
  j.status = status;
  DB.saveJob(j);
  toast('Marked ' + { inprogress: 'in progress', completed: 'complete' }[status]);
  render();
}

function render() {
  const jobs     = DB.getJobs();
  const invoices = DB.getInvoices();
  const now      = new Date();
  const today    = todayISO();

  // ── Greeting ──────────────────────────────────────────────────────
  const hour      = now.getHours();
  const timeGreet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const settings  = DB.getSettings();
  const firstName = settings.ownerName ? ', ' + settings.ownerName.split(' ')[0] : '';
  document.getElementById('greetingName').textContent = timeGreet + firstName;
  document.getElementById('greetingDate').textContent =
    now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // ── Data ──────────────────────────────────────────────────────────
  const todayJobs    = jobs.filter(j => j.date === today);
  const inProgress   = jobs.filter(j => j.status === 'inprogress');
  const unpaid       = invoices.filter(i => i.status === 'sent' || i.status === 'overdue');
  const unpaidAmt    = unpaid.reduce((s, i) => s + (i.total || 0), 0);
  const overdueInvs  = invoices.filter(i => i.status === 'overdue');
  const overdueAmt   = overdueInvs.reduce((s, i) => s + (i.total || 0), 0);
  const monthPrefix  = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const monthRev     = invoices
    .filter(i => i.status === 'paid' && i.issuedAt?.startsWith(monthPrefix))
    .reduce((s, i) => s + (i.total || 0), 0);

  // ── Summary line ──────────────────────────────────────────────────
  const parts = [];
  if (todayJobs.length)    parts.push(`${todayJobs.length} job${todayJobs.length !== 1 ? 's' : ''} today`);
  if (unpaidAmt > 0)       parts.push(`${fmtMoney(unpaidAmt)} outstanding`);
  if (overdueInvs.length)  parts.push(`<span style="color:var(--s-due)">${overdueInvs.length} overdue</span>`);
  document.getElementById('dashSummary').innerHTML =
    parts.length ? parts.join(' &middot; ') : 'All caught up.';

  // ── Stats ─────────────────────────────────────────────────────────
  countUp(document.getElementById('statToday'),    String(todayJobs.length));
  countUp(document.getElementById('statUnpaid'),   fmtMoney(unpaidAmt));
  countUp(document.getElementById('statMonth'),    fmtMoney(monthRev));
  countUp(document.getElementById('statProgress'), String(inProgress.length));

  const progToday = todayJobs.filter(j => j.status === 'inprogress').length;
  document.getElementById('statTodaySub').textContent =
    progToday > 0 ? `${progToday} in progress` : todayJobs.length ? 'All scheduled' : 'None today';
  document.getElementById('statUnpaidSub').innerHTML =
    overdueInvs.length
      ? `<span style="color:var(--s-due)">${overdueInvs.length} overdue</span>`
      : 'All current';
  document.getElementById('statMonthLabel').textContent =
    now.toLocaleDateString('en-GB', { month: 'long' });

  // ── Today's job cards ─────────────────────────────────────────────
  const listEl   = document.getElementById('todayJobsList');
  const emptyEl  = document.getElementById('todayEmpty');
  if (!todayJobs.length) {
    listEl.style.display  = 'none';
    emptyEl.style.display = 'flex';
  } else {
    listEl.style.display  = '';
    emptyEl.style.display = 'none';
    listEl.innerHTML = todayJobs.map(j => {
      const c          = DB.getCustomer(j.customerId);
      const nextStatus = j.status === 'scheduled'  ? 'inprogress'
                       : j.status === 'inprogress' ? 'completed' : null;
      const nextLabel  = nextStatus === 'inprogress' ? 'Start job'
                       : nextStatus === 'completed'  ? 'Mark complete' : null;
      return `<div class="job-card">
        <div class="job-card-head">
          <span class="job-card-title">${escHtml(j.title)}</span>
          ${badge(j.status)}
        </div>
        <div class="job-card-meta">
          <span>${escHtml(c?.name || '—')}</span>
          ${j.location ? `<span class="job-card-sep">·</span><span class="job-card-loc">${escHtml(j.location)}</span>` : ''}
        </div>
        <div class="job-card-foot">
          ${nextLabel ? `<button class="btn btn-primary btn-xs" onclick="quickStatus('${j.id}','${nextStatus}',event)">${nextLabel}</button>` : `<span style="font-size:12px;color:var(--s-done)">✓ Done</span>`}
          <a href="jobs.html" class="btn btn-ghost btn-xs">All jobs</a>
        </div>
      </div>`;
    }).join('');
  }

  // ── Overdue alert banner ──────────────────────────────────────────
  const alertEl = document.getElementById('overdueAlert');
  if (overdueInvs.length) {
    alertEl.style.display = '';
    alertEl.innerHTML = `<div class="overdue-alert">
      <div class="overdue-alert-icon">!</div>
      <div class="overdue-alert-body">
        <div class="overdue-alert-title">${overdueInvs.length} overdue invoice${overdueInvs.length > 1 ? 's' : ''}</div>
        <div class="overdue-alert-sub">${fmtMoney(overdueAmt)} needs chasing</div>
      </div>
      <a href="invoices.html" class="btn btn-danger btn-sm">Chase</a>
    </div>`;
  } else {
    alertEl.style.display = 'none';
  }

  // ── This week timeline ────────────────────────────────────────────
  const sevenDays   = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() + i + 1); return d.toISOString().slice(0, 10);
  });
  const tomorrowISO = sevenDays[0];
  const upcoming    = jobs
    .filter(j => sevenDays.includes(j.date) && j.status !== 'completed' && j.status !== 'invoiced')
    .sort((a, b) => a.date.localeCompare(b.date));

  const timelineEl = document.getElementById('upcomingTimeline');
  const upEmptyEl  = document.getElementById('upcomingEmpty');

  if (!upcoming.length) {
    timelineEl.style.display = 'none';
    upEmptyEl.style.display  = '';
  } else {
    timelineEl.style.display = '';
    upEmptyEl.style.display  = 'none';

    const byDay = {};
    upcoming.forEach(j => { (byDay[j.date] = byDay[j.date] || []).push(j); });

    timelineEl.innerHTML = Object.entries(byDay).map(([date, dayJobs]) => {
      const d      = new Date(date + 'T12:00:00');
      const label  = date === tomorrowISO
        ? 'Tomorrow'
        : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      return `<div class="timeline-day">
        <div class="timeline-day-label">${label}</div>
        ${dayJobs.map(j => {
          const c = DB.getCustomer(j.customerId);
          return `<div class="timeline-item">
            <div class="tl-dot tl-dot-${j.status}"></div>
            <div class="tl-content">
              <span class="tl-title">${escHtml(j.title)}</span>
              <span class="tl-meta">${escHtml(c?.name || '—')}</span>
            </div>
            ${badge(j.status)}
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
  }
}

render();
</script>
</body>
</html>
