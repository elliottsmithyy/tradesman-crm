<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs — TradeBase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="sidebarMount"></div>

  <div class="main">
    <header class="topbar">
      <span class="page-title">Jobs</span>
      <div class="topbar-right">
        <button class="btn btn-primary" id="newJobBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Job
        </button>
      </div>
    </header>
    <main class="content">

      <div class="filter-bar" id="filterBar">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="scheduled">Scheduled</button>
        <button class="chip" data-filter="inprogress">In Progress</button>
        <button class="chip" data-filter="completed">Completed</button>
        <button class="chip" data-filter="invoiced">Invoiced</button>
      </div>

      <div class="tbl-wrap">
        <div class="tbl-top">
          <span class="tbl-title" id="jobCount">All Jobs</span>
          <div class="tbl-actions">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" type="text" placeholder="Search jobs..." id="searchInput">
            </div>
          </div>
        </div>
        <table id="jobsTable">
          <thead>
            <tr>
              <th>Job</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="jobsTbody"></tbody>
        </table>
        <div id="jobsEmpty" class="empty" style="display:none">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <p class="empty-title">No jobs found</p>
          <p class="empty-desc">No jobs match the current filter. Try a different status or add a new job.</p>
          <button class="btn btn-primary" id="emptyNewBtn">Add Job</button>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Detail drawer -->
<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="drawer" id="detailDrawer">
  <div class="drawer-head">
    <span class="drawer-title" id="detailTitle">Job Detail</span>
    <button class="close-btn" onclick="closeDetail()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="detailBody"></div>
  <div class="drawer-foot" id="detailFoot"></div>
</div>

<!-- Form drawer -->
<div class="overlay" id="formOverlay" onclick="closeForm()"></div>
<div class="drawer" id="formDrawer">
  <div class="drawer-head">
    <span class="drawer-title" id="formTitle">New Job</span>
    <button class="close-btn" onclick="closeForm()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <form id="jobForm" class="form-gap">
      <input type="hidden" id="fId">
      <div class="section-label" style="margin-top:0">Job Details</div>
      <div class="form-grid">
        <div class="form-group span-2">
          <label class="form-label">Job Title *</label>
          <input class="form-ctrl" type="text" id="fTitle" required placeholder="e.g. Boiler Service">
        </div>
        <div class="form-group">
          <label class="form-label">Customer *</label>
          <select class="form-ctrl" id="fCustomer" required>
            <option value="">Select customer...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-ctrl" type="date" id="fDate">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-ctrl" id="fStatus">
            <option value="scheduled">Scheduled</option>
            <option value="inprogress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="invoiced">Invoiced</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input class="form-ctrl" type="text" id="fLocation" placeholder="Leave blank to use customer address">
        </div>
        <div class="form-group span-2">
          <label class="form-label">Description</label>
          <textarea class="form-ctrl" id="fDesc" rows="2" placeholder="Work to be carried out..."></textarea>
        </div>
        <div class="form-group span-2">
          <label class="form-label">Notes</label>
          <textarea class="form-ctrl" id="fNotes" rows="2" placeholder="Access details, materials needed..."></textarea>
        </div>
      </div>
    </form>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-secondary" onclick="closeForm()">Cancel</button>
    <button class="btn btn-primary" id="saveJobBtn">Save Job</button>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="app.js"></script>
<script>
document.getElementById('sidebarMount').outerHTML = sidebarHtml('jobs.html');

let activeFilter = 'all';
let activeJobId  = null;

// ── Render ──────────────────────────────────────────────────────────────

function render(q = '') {
  const jobs      = DB.getJobs();
  const customers = DB.getCustomers();
  const query     = q.toLowerCase();

  let filtered = activeFilter === 'all' ? jobs : jobs.filter(j => j.status === activeFilter);
  if (query) {
    filtered = filtered.filter(j => {
      const c = DB.getCustomer(j.customerId);
      return j.title.toLowerCase().includes(query) ||
             (c?.name || '').toLowerCase().includes(query) ||
             (j.location || '').toLowerCase().includes(query);
    });
  }
  filtered.sort((a, b) => b.date.localeCompare(a.date));

  document.getElementById('jobCount').textContent =
    `${filtered.length} Job${filtered.length !== 1 ? 's' : ''}${activeFilter !== 'all' ? ` — ${activeFilter}` : ''}`;

  const tbody = document.getElementById('jobsTbody');
  const empty = document.getElementById('jobsEmpty');
  const table = document.getElementById('jobsTable');

  if (filtered.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  table.style.display = '';
  empty.style.display = 'none';

  tbody.innerHTML = filtered.map(j => {
    const c = DB.getCustomer(j.customerId);
    const isToday = j.date === todayISO();
    return `<tr onclick="openDetail('${j.id}')" style="cursor:pointer">
      <td>
        <span style="font-weight:500">${escHtml(j.title)}</span>
        ${isToday ? `<span style="font-size:10.5px;font-weight:600;color:var(--accent);margin-left:7px;text-transform:uppercase;letter-spacing:0.04em">Today</span>` : ''}
        ${j.description ? `<br><span class="td-muted" style="font-size:12px">${escHtml(j.description.slice(0, 60))}${j.description.length > 60 ? '...' : ''}</span>` : ''}
      </td>
      <td class="td-muted">${escHtml(c?.name || '—')}</td>
      <td class="td-muted td-num">${fmtDateShort(j.date)}</td>
      <td>${badge(j.status)}</td>
      <td class="td-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="openEdit('${j.id}')">Edit</button>
      </td>
    </tr>`;
  }).join('');
}

// ── Detail drawer ─────────────────────────────────────────────────────

function openDetail(id) {
  activeJobId = id;
  const j = DB.getJob(id);
  if (!j) return;
  const c = DB.getCustomer(j.customerId);

  document.getElementById('detailTitle').textContent = j.title;
  document.getElementById('detailBody').innerHTML = `
    <div class="section-label" style="margin-top:0">Details</div>
    <div class="detail-field"><div class="detail-key">Status</div><div class="detail-val">${badge(j.status)}</div></div>
    <div class="detail-field"><div class="detail-key">Date</div><div class="detail-val">${fmtDate(j.date) || '—'}</div></div>
    <div class="detail-field"><div class="detail-key">Customer</div><div class="detail-val">${c ? `<a href="customers.html" style="color:var(--accent)">${escHtml(c.name)}</a>` : '—'}</div></div>
    <div class="detail-field"><div class="detail-key">Location</div><div class="detail-val">${escHtml(j.location || c?.address || '—')}</div></div>
    ${j.description ? `<div class="detail-field"><div class="detail-key">Description</div><div class="detail-val">${escHtml(j.description)}</div></div>` : ''}
    ${j.notes ? `<div class="detail-field"><div class="detail-key">Notes</div><div class="detail-val">${escHtml(j.notes)}</div></div>` : ''}
    <div class="detail-field"><div class="detail-key">Created</div><div class="detail-val">${fmtDate(j.createdAt)}</div></div>

    ${j.invoiceId ? `
    <div class="section-label">Linked Invoice</div>
    <div class="activity-item">
      <div class="activity-dot" style="background:var(--s-done)"></div>
      <div style="flex:1">
        <div class="activity-text"><strong>${escHtml(DB.getInvoice(j.invoiceId)?.number || '?')}</strong> &middot; ${fmtMoney(DB.getInvoice(j.invoiceId)?.total)}</div>
        <div class="activity-time">${badge(DB.getInvoice(j.invoiceId)?.status || 'draft')}</div>
      </div>
    </div>` : ''}

    <div class="section-label">Update Status</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${['scheduled','inprogress','completed','invoiced'].map(s =>
        `<button class="chip${j.status === s ? ' active' : ''}" onclick="updateStatus('${j.id}','${s}')">${{scheduled:'Scheduled',inprogress:'In Progress',completed:'Completed',invoiced:'Invoiced'}[s]}</button>`
      ).join('')}
    </div>

    <div class="section-label" style="margin-top:20px">Site Log</div>
    <div id="siteLogList"></div>
    <div class="note-compose" id="noteCompose" style="display:none">
      <textarea id="noteText" rows="3" placeholder="What happened on site today?"></textarea>
      <div class="note-compose-actions">
        <button class="btn btn-primary btn-sm" onclick="submitNote('${j.id}')">Save Note</button>
        <button class="btn btn-ghost btn-sm" onclick="cancelNote()">Cancel</button>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm" id="addNoteBtn" onclick="showNoteCompose()" style="margin-top:8px">+ Add note</button>

    <div class="section-label" style="margin-top:20px">Photos</div>
    <div class="photo-grid" id="photoGrid"></div>
    <label class="btn btn-ghost btn-sm" style="margin-top:10px;cursor:pointer">
      + Add photos
      <input type="file" accept="image/*" multiple style="display:none" id="photoInput">
    </label>
  `;

  renderSiteLog(j);
  renderPhotos(j);
  document.getElementById('photoInput').addEventListener('change', function() {
    handlePhotos(j.id, this.files);
  });

  document.getElementById('detailFoot').innerHTML = `
    <button class="btn btn-danger btn-sm" onclick="confirmDelete('${j.id}')">Delete</button>
    <a href="invoices.html" class="btn btn-secondary btn-sm">Create Invoice</a>
    <button class="btn btn-primary btn-sm" onclick="openEdit('${j.id}')">Edit</button>
  `;

  openDrawer('detailDrawer', 'overlay');
}

function closeDetail() { closeDrawer('detailDrawer', 'overlay'); }

function updateStatus(id, status) {
  const j = DB.getJob(id);
  if (!j) return;
  j.status = status;
  DB.saveJob(j);
  openDetail(id);
  render(document.getElementById('searchInput').value);
  toast('Status updated');
}

function confirmDelete(id) {
  const j = DB.getJob(id);
  if (!confirm(`Delete "${j?.title}"?`)) return;
  DB.deleteJob(id);
  closeDetail();
  toast('Job deleted');
  render(document.getElementById('searchInput').value);
}

// ── Form drawer ───────────────────────────────────────────────────────

function populateCustomerSelect(selectedId = '') {
  const sel = document.getElementById('fCustomer');
  const customers = DB.getCustomers();
  sel.innerHTML = '<option value="">Select customer...</option>' +
    customers.map(c => `<option value="${c.id}"${c.id === selectedId ? ' selected' : ''}>${escHtml(c.name)}</option>`).join('');
}

function openNew() {
  document.getElementById('formTitle').textContent = 'New Job';
  document.getElementById('fId').value    = '';
  document.getElementById('fTitle').value = '';
  document.getElementById('fDate').value  = todayISO();
  document.getElementById('fStatus').value = 'scheduled';
  document.getElementById('fLocation').value = '';
  document.getElementById('fDesc').value  = '';
  document.getElementById('fNotes').value = '';
  populateCustomerSelect();
  openDrawer('formDrawer', 'formOverlay');
  document.getElementById('fTitle').focus();
}

function openEdit(id) {
  const j = DB.getJob(id);
  if (!j) return;
  document.getElementById('formTitle').textContent = 'Edit Job';
  document.getElementById('fId').value     = j.id;
  document.getElementById('fTitle').value  = j.title;
  document.getElementById('fDate').value   = j.date || '';
  document.getElementById('fStatus').value = j.status;
  document.getElementById('fLocation').value = j.location || '';
  document.getElementById('fDesc').value   = j.description || '';
  document.getElementById('fNotes').value  = j.notes || '';
  populateCustomerSelect(j.customerId);
  closeDetail();
  openDrawer('formDrawer', 'formOverlay');
}

function closeForm() { closeDrawer('formDrawer', 'formOverlay'); }

document.getElementById('saveJobBtn').addEventListener('click', () => {
  const title      = document.getElementById('fTitle').value.trim();
  const customerId = document.getElementById('fCustomer').value;
  if (!title)      { toast('Job title is required', 'err'); return; }
  if (!customerId) { toast('Please select a customer', 'err'); return; }

  const id = document.getElementById('fId').value || uid();
  const loc = document.getElementById('fLocation').value.trim();
  const customer = DB.getCustomer(customerId);

  const existing = DB.getJob(id);
  DB.saveJob({
    id,
    title,
    customerId,
    date:        document.getElementById('fDate').value || todayISO(),
    status:      document.getElementById('fStatus').value,
    location:    loc || customer?.address || '',
    description: document.getElementById('fDesc').value.trim(),
    notes:       document.getElementById('fNotes').value.trim(),
    invoiceId:   existing?.invoiceId  || null,
    siteLog:     existing?.siteLog    || [],
    photos:      existing?.photos     || [],
    createdAt:   existing?.createdAt  || todayISO(),
  });

  closeForm();
  toast(document.getElementById('fId').value ? 'Job updated' : 'Job added');
  render(document.getElementById('searchInput').value);
});

// ── Filters ───────────────────────────────────────────────────────────

document.getElementById('filterBar').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render(document.getElementById('searchInput').value);
});

// ── Site Log ──────────────────────────────────────────────────────────

function renderSiteLog(job) {
  const list = document.getElementById('siteLogList');
  if (!list) return;
  const notes = (job.siteLog || []).slice().reverse();
  if (!notes.length) {
    list.innerHTML = `<div style="font-size:12.5px;color:var(--text-3);padding:6px 0 2px">No site notes yet.</div>`;
    return;
  }
  list.innerHTML = notes.map(n => `
    <div class="site-note">
      <div class="site-note-dot"></div>
      <div class="site-note-body">
        <div class="site-note-text">${escHtml(n.text)}</div>
        <div class="site-note-time">${new Date(n.createdAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <span class="site-note-del" onclick="deleteSiteNote('${job.id}','${n.id}')" title="Delete">×</span>
    </div>`).join('');
}

function showNoteCompose() {
  document.getElementById('noteCompose').style.display = '';
  document.getElementById('addNoteBtn').style.display  = 'none';
  document.getElementById('noteText').focus();
}

function cancelNote() {
  document.getElementById('noteCompose').style.display = 'none';
  document.getElementById('addNoteBtn').style.display  = '';
  document.getElementById('noteText').value = '';
}

function submitNote(jobId) {
  const text = document.getElementById('noteText').value.trim();
  if (!text) { toast('Note cannot be empty', 'err'); return; }
  const j = DB.getJob(jobId);
  if (!j) return;
  j.siteLog = j.siteLog || [];
  j.siteLog.push({ id: uid(), text, createdAt: new Date().toISOString() });
  DB.saveJob(j);
  renderSiteLog(j);
  cancelNote();
  toast('Note added');
}

function deleteSiteNote(jobId, noteId) {
  const j = DB.getJob(jobId);
  if (!j) return;
  j.siteLog = (j.siteLog || []).filter(n => n.id !== noteId);
  DB.saveJob(j);
  renderSiteLog(j);
}

// ── Photos ────────────────────────────────────────────────────────────

function renderPhotos(job) {
  const grid = document.getElementById('photoGrid');
  if (!grid) return;
  const photos = job.photos || [];
  if (!photos.length) {
    grid.innerHTML = `<div style="font-size:12.5px;color:var(--text-3);padding:4px 0;grid-column:1/-1">No photos yet.</div>`;
    return;
  }
  grid.innerHTML = photos.map(p =>
    `<div class="photo-thumb" data-photoid="${p.id}" title="${escHtml(p.name || '')}">
      <img src="${p.dataUrl}" alt="${escHtml(p.name || 'photo')}">
    </div>`
  ).join('');
  grid.querySelectorAll('.photo-thumb').forEach(el => {
    el.addEventListener('click', () => {
      const photo = (DB.getJob(activeJobId)?.photos || []).find(p => p.id === el.dataset.photoid);
      if (photo) showLightbox(photo.dataUrl);
    });
  });
}

function resizeImage(file, maxPx = 900) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.82), name: file.name });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotos(jobId, files) {
  if (!files || !files.length) return;
  const j = DB.getJob(jobId);
  if (!j) return;
  j.photos = j.photos || [];
  let added = 0;
  for (const file of files) {
    try {
      const { dataUrl, name } = await resizeImage(file);
      j.photos.push({ id: uid(), name, dataUrl, createdAt: new Date().toISOString() });
      added++;
    } catch { toast('Could not read ' + file.name, 'err'); }
  }
  if (added) {
    DB.saveJob(j);
    renderPhotos(j);
    toast(`${added} photo${added > 1 ? 's' : ''} added`);
  }
  document.getElementById('photoInput').value = '';
}

function showLightbox(dataUrl) {
  const lb = document.createElement('div');
  lb.className = 'photo-lightbox';
  lb.innerHTML = `<img src="${dataUrl}" alt="Site photo">`;
  lb.addEventListener('click', () => lb.remove());
  const esc = e => { if (e.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', esc); } };
  document.addEventListener('keydown', esc);
  document.body.appendChild(lb);
}

// ── Events ────────────────────────────────────────────────────────────

document.getElementById('newJobBtn').addEventListener('click', openNew);
document.getElementById('emptyNewBtn').addEventListener('click', openNew);
document.getElementById('searchInput').addEventListener('input', e => render(e.target.value));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDetail(); closeForm(); } });
window.addEventListener('tb:opennew', e => { if (e.detail === 'job') openNew(); });

render();
</script>
</body>
</html>
